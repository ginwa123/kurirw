# CI: build, test and package Kurir on macOS, Linux and Windows.
#
# Three legs, one per platform, all of them real: the app links the platform's own window stack
# (Cocoa, Wayland/EGL/GLES3, Win32/D3D11) and the suite drives the real App headlessly.
#
# A `v*` tag turns the same jobs into a release: every leg uploads its binary as a workflow
# artifact, and the `release` job publishes them on the GitHub release for that tag.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # 60, not 30: a macOS runner that waits for its brew bottles and then runs the whole suite went
    # over half an hour once, and a cancelled leg is a release that never gets published.
    timeout-minutes: 60
    env:
      # brew's own update can take longer than the build it exists to support.
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux
            slug: linux-x86_64
            archive: kurirw-linux-x86_64.tar.gz
          - os: macos-15
            label: macOS (arm64)
            slug: macos-arm64
            archive: kurirw-macos-arm64.tar.gz
          - os: windows-2022
            label: Windows
            slug: windows-x86_64
            archive: kurirw-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v4

      # The version lives in three places by necessity (the manifest, the source the binary prints, and
      # the tag the installer downloads), so the first thing a tag run does is prove they agree.
      - name: The version agrees with the tag
        run: |
          set -euo pipefail
          test -z "${GITHUB_REF_TYPE:-}" || test "$GITHUB_REF_TYPE" = "tag" || { echo "not a tag run"; exit 0; }
          manifest=$(sed -n 's/^ *\.version = "\(.*\)".*/\1/p' build.zig.zon)
          source=$(sed -n 's/^pub const text = "\(.*\)";.*/\1/p' src/version.zig)
          echo "manifest=$manifest source=$source tag=${GITHUB_REF_NAME:-none}"
          test "$manifest" = "$source" || { echo "::error::build.zig.zon says $manifest, src/version.zig says $source"; exit 1; }
          if [ -n "${GITHUB_REF_NAME:-}" ]; then
            test "v$manifest" = "$GITHUB_REF_NAME" || { echo "::error::the tag is $GITHUB_REF_NAME, the code says v$manifest"; exit 1; }
          fi

      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      # The toolkit's Linux window stack: wayland-client/EGL/GLES3 plus the pango/cairo text path.
      # Its build shells out to /usr/sbin/wayland-scanner, which is why the binary is symlinked there.
      - name: Install the Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            fonts-dejavu-core \
            libcairo2-dev \
            libegl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libfribidi-dev \
            libglib2.0-dev \
            libgles-dev \
            libharfbuzz-dev \
            libpango1.0-dev \
            libpixman-1-dev \
            libpng-dev \
            libwayland-dev \
            libcurl4-openssl-dev \
            libssl-dev

          scanner="$(command -v wayland-scanner)"
          test -n "$scanner"
          sudo ln -sf "$scanner" /usr/sbin/wayland-scanner

          echo "C_INCLUDE_PATH=/usr/lib/$(gcc -print-multiarch)/glib-2.0/include" >> "$GITHUB_ENV"

      # kabelweb accepts only Homebrew's keg paths for curl + openssl, and the repository carries no
      # vendored curl archive, so the system pair has to be installed.
      - name: Install the macOS curl and openssl kegs
        if: runner.os == 'macOS'
        run: brew install curl openssl@3 dylibbundler

      # No install step on Windows on purpose: kabelweb probes for vcpkg's curl and, finding none,
      # builds its own stub libcurl, so the suite compiles, links and runs here. The build prints which
      # path it took ("[kabelweb] using ... libcurl"), which is where a red leg is read from.

      - name: Check formatting
        run: zig fmt --check build.zig src tools

      - name: Build
        run: zig build -Drequire-real-curl=true

      - name: Test (unit + headless E2E + the line-count tool)
        run: zig build test -Drequire-real-curl=true --summary all

      # ── The one thing the suite cannot prove: that Send really sends ──
      #
      # Every test above swaps the transport for a Fake, so the whole suite passes
      # on a binary whose libcurl is a no-op stub — which is exactly how the first
      # Windows release shipped a client that could never reach the network. These
      # steps run `src/smoke.zig`, which goes through the PRODUCTION transport
      # (`kurirw.http.Real` → kabelweb → libcurl), at the same optimisation the
      # release uses, with `-Drequire-real-curl=true` so a stub build fails before
      # it can run.
      - name: Send a real HTTP request (local server, production transport)
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then py=python; else py=python3; fi
          "$py" -m http.server 8123 --bind 127.0.0.1 >/dev/null 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          sleep 2
          KURIR_SMOKE_URL=http://127.0.0.1:8123/ \
            zig build smoke -Doptimize=ReleaseFast -Drequire-real-curl=true

      - name: Send a real HTTPS request (TLS through the platform's own stack)
        run: |
          set -euo pipefail
          # Three attempts: a flaky runner network is not a broken TLS stack. A
          # stubbed or mistls-configured build fails all three, every time.
          for attempt in 1 2 3; do
            if KURIR_SMOKE_URL=https://example.com/ \
                 zig build smoke -Doptimize=ReleaseFast -Drequire-real-curl=true; then
              echo "https ok on attempt $attempt"
              exit 0
            fi
            echo "https attempt $attempt failed"
            sleep 3
          done
          echo "::error::the real transport could not complete an HTTPS request"
          exit 1

      - name: Lint (zginlint) and the 3000-line cap
        run: |
          zig build zginlint:check
          zig build lines:check

      # PRODUCTION BUILD. ReleaseFast, not the `Debug` default and not ReleaseSafe: this is the
      # binary users download, so it is the fast one with runtime safety checks off. Every other
      # `zig build` in this file is a test/verification build and stays at the default.
      #
      # `-Dcpu=baseline` is load-bearing: without it Zig compiles for the RUNNER's own CPU, and a
      # runner with newer vector instructions than the machine that downloads the archive produces
      # a binary that dies at startup with 0xC000001D (illegal instruction). That is exactly what
      # the 0.1.19 Windows zip did on a developer machine. A release is built for the oldest CPU the
      # platform promises, not for the machine that happened to compile it.
      - name: Build the release binary (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast -Drequire-real-curl=true -Dcpu=baseline

      # One binary per platform, packaged the way the installer expects to find it.
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ -f zig-out/bin/kurirw.exe ]; then
            cp zig-out/bin/kurirw.exe dist/
            powershell -NoProfile -Command "Compress-Archive -Path dist/kurirw.exe -DestinationPath '${{ matrix.archive }}' -Force"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            # A macOS build links Homebrew's curl + openssl by ABSOLUTE keg path, so a plain copy only
            # runs on a Mac with the same minor versions. dylibbundler copies the whole dyld graph into
            # lib/ and rewrites the references, which is what makes the download work on someone else's Mac.
            cp zig-out/bin/kurirw dist/
            mkdir -p dist/lib
            # @executable_path, not @loader_path: a library INSIDE lib/ resolves @loader_path to lib/
            # itself, which turns every reference into lib/lib/<name>.
            dylibbundler -of -b -x dist/kurirw -d dist/lib -p @executable_path/lib
            # An arm64 Mac refuses to load code whose signature no longer matches the file, and
            # install_name_tool invalidated every one of them: re-sign the bundle ad-hoc.
            codesign --force --sign - dist/lib/*.dylib
            codesign --force --sign - dist/kurirw
            echo "bundled: $(ls dist/lib | tr '\n' ' ')"
            tar -czf "${{ matrix.archive }}" -C dist kurirw lib
          else
            cp zig-out/bin/kurirw dist/kurirw
            tar -czf "${{ matrix.archive }}" -C dist kurirw
          fi
          ls -l "${{ matrix.archive }}"

      # What the installer reads back. The binary that ships has to be able to say which version it is,
      # and on a tag it has to say the tag's own number: a stale archive under a fresh name is exactly
      # the bug this gate exists for.
      - name: The packaged binary knows its version
        run: |
          set -euo pipefail
          if [ -f dist/kurirw.exe ]; then exe=dist/kurirw.exe; else exe=dist/kurirw; fi
          out=$(DYLD_LIBRARY_PATH="$PWD/dist/lib" "$exe" --version 2>&1)
          echo "$out"
          case "$out" in
            "kurirw "?*) ;;
            *) echo "::error::--version printed '$out'"; exit 1 ;;
          esac
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            echo "$out" | grep -qx "kurirw ${GITHUB_REF_NAME#v}" || {
              echo "::error::the binary says '$out', the tag is $GITHUB_REF_NAME"
              exit 1
            }
          fi

      # A gate on the ARTIFACT, not on the build: the packaged binary has to start. A macOS dylib bundle
      # is easy to get subtly wrong (a wrong prefix, a stale signature), and neither shows up in
      # `zig build test` — only in a user's dyld error.
      - name: The packaged binary starts
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          tar -xzf "${{ matrix.archive }}" -C "$work"
          log="$work/run.log"
          env KURIR_HOME="$work/home" "$work/kurirw" >"$log" 2>&1 &
          pid=$!
          for _ in $(seq 1 30); do
            grep -q 'macOS first frame:' "$log" 2>/dev/null && break
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          kill -9 "$pid" 2>/dev/null || true
          cat "$log"
          grep -q 'macOS first frame:' "$log"

      - uses: actions/upload-artifact@v4
        with:
          name: kurirw-${{ matrix.slug }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  # Publishes the three binaries on the tag's GitHub release. It runs only for `v*` tags, and only
  # after every platform leg is green, so a release can never carry a binary that failed its tests.
  release:
    name: Publish the release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l assets
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "Kurir $GITHUB_REF_NAME" \
              --notes-file docs/RELEASE_NOTES.md
          fi
          gh release upload "$GITHUB_REF_NAME" assets/* --clobber
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'
